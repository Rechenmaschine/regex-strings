[package]
categories = ["algorithms", "text-processing"]
description = "Lazily enumerate strings matched by a regular expression over a finite alphabet"
documentation = "https://docs.rs/regex-strings"
edition = "2024"
keywords = ["regex", "strings", "enumeration", "generation"]
license = "MIT OR Apache-2.0"
name = "regex-strings"
readme = "README.md"
repository = "https://github.com/Rechenmaschine/regex-strings"
rust-version = "1.85"
version = "0.1.1"

[dependencies]
regex = "1.13.1"
regex-syntax = "0.8.11"
