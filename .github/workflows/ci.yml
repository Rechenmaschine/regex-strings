name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - run: cargo build --workspace --release --locked

      - run: cargo test --workspace --all-features --locked

      - run: cargo package --manifest-path regex-strings/Cargo.toml --locked

      - run: cargo fmt --manifest-path web/Cargo.toml -- --check

      - run: cargo clippy --manifest-path web/Cargo.toml --all-targets --all-features -- -D warnings

      - run: cargo test --manifest-path web/Cargo.toml --locked

      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - run: cargo install cargo-fuzz --locked
        env:
          RUSTFLAGS: ""

      - run: cargo fuzz run enumeration_matches_regex -- -max_total_time=60
        env:
          RUSTFLAGS: ""

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
